plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.17.0'
	id 'org.sonarqube' version '6.0.1.5171'
	id 'jacoco'
}

group = 'org.labcabrera.sample'
version = '0.1.0-SNAPSHOT'
description = 'Archetype for Spring Boot using Spring Cloud Stream'

ext {
	logstashLogbackVersion = '7.4'
	springdocVersion = '2.8.14'
	swaggerAnnotationsVersion = '2.2.13'
	springCloudVersion = '2025.0.0'
	rsqlParserVersion = '2.1.0'
	mapstructVersion = '1.5.5.Final'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation "cz.jirutka.rsql:rsql-parser:${rsqlParserVersion}"
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"

	implementation "org.webjars:swagger-ui:4.15.5"

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	compileOnly 'org.projectlombok:lombok'
  	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}
openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/src/main/resources/api-definition.yaml"
    outputDir = "$buildDir/generated/sources/openapi/server"
    apiPackage = "com.labcabrera.sample.archetype.generated.api"
    modelPackage = "com.labcabrera.sample.archetype.generated.model"
    configOptions = [
		library 			: "spring-cloud",
        dateLibrary         : "java8",
        interfaceOnly       : "true",
        useTags             : "true",
        useSpringBoot3      : "true",
        singleContentTypes  : "true",
        unhandledException  : "true",
		openApiNullable     : "false",
		dateLibrary         : "java8-localdatetime"
    ]
	additionalProperties = [
		useJacksonNullable: "false"
	]
}

// Additional OpenAPI Generator task: generate a Java REST client from api-clients/user-api.yaml
tasks.register('openApiGenerateUserApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = "feign"
	inputSpec = "$rootDir/src/main/resources/api-clients/user-api.yaml"
	outputDir = "$buildDir/generated/sources/openapi/user-client"
	apiPackage = 'org.labcabrera.sample.archetype.generated.client.user.api'
	modelPackage = 'org.labcabrera.sample.archetype.generated.client.user.model'
	invokerPackage = 'org.labcabrera.sample.archetype.generated.client.user'
	configOptions = [
		useSpringBoot3: 'true',
		interfaceOnly: 'true',
		useFeignClientUrls: 'true',
		useFeignClientContextId: 'true',
		useTags: 'true',
		dateLibrary: 'java8',
		useJakartaEe: 'true',
		openApiNullable: 'false',
	]
	additionalProperties = [
		serializableModel: 'true'
	]
}

sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/server/src/main/java")
sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/user-client/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
	dependsOn tasks.named('openApiGenerateUserApi')
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/annotations")
	options.compilerArgs += ["-Amapstruct.defaultComponentModel=spring"]
}

jar {
	enabled = false
	archiveClassifier = ''
}

sonarqube {
	properties {
		property "sonar.projectKey", "archetype-spring-cloud-stream-vertical-slice-contract-first"
		property "sonar.projectName", "Archetype Spring Cloud Stream Vertical Slice Contract First"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", System.getenv("SONAR_TOKEN")
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
	}
}
