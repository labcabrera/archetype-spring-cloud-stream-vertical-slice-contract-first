openapi: 3.0.1
info:
  title: Users API
  description: Sample Users API.
  contact:
    name: Luis Cabrera
    email: lab.cabrera@gmail.com
  version: 1.0.0
servers:
  - url: http://localhost:8083
security:
  - oidc: []
tags:
  - name: Users
    description: API for user management
paths:
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Get users by RSQL
      description: Filter users using an RSQL expression with optional pagination
      operationId: getByRsql
      parameters:
        - name: q
          in: query
          description: RSQL expression to filter users
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDtoPageResponse'
        '400':
          description: Invalid RSQL expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - Users
      summary: Create new user
      description: Creates a new user using the CQRS pattern. Sends a command that emits an event.
      operationId: create
      requestBody:
        description: User data to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by id
      description: Retrieve a specific user by its unique identifier
      operationId: getById
      parameters:
        - name: userId
          in: path
          description: Unique user identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes an existing user using the CQRS pattern. Sends a command that emits an event.
      operationId: delete
      parameters:
        - name: userId
          in: path
          description: Unique user identifier
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user using the CQRS pattern. Sends a command that emits an event.
      operationId: update
      parameters:
        - name: userId
          in: path
          description: Unique user identifier
          required: true
          schema:
            type: string
      requestBody:
        description: User data to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name
    UserDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ApiError:
      type: object
      description: API error information
      properties:
        code:
          type: string
          description: Error code
          example: case-folder.msg.err.not-found
        message:
          type: string
          description: Detailed error message
          example: Case folder not found
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error
        details:
          type: array
          description: Validation errors, if any
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required:
        - code
        - message
        - timestamp
    ApiErrorDetail:
      type: object
      description: API error detail
      properties:
        key:
          type: string
          description: Error key
          example: name
        message:
          type: string
          description: Error message
          example: Field is required
      required:
        - key
        - message
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
    Pagination:
      type: object
      description: Pagination information
      properties:
        page:
          type: integer
          format: int32
          description: Current page number (0-based)
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of elements
          example: 100
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 5
      required:
        - page
        - size
        - totalElements
        - totalPages
    UserDtoPageResponse:
      type: object
      properties:
        content:
          type: array
          description: List of items in the current page
          items:
            $ref: '#/components/schemas/UserDto'
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Pagination details
      required:
        - content
        - pagination
  securitySchemes:
    bearer-jwt:
      type: http
      description: 'Enter JWT bearer token as: Bearer <token>'
      scheme: bearer
      bearerFormat: JWT
    oidc:
      type: oauth2
      description: OAuth2 con OIDC contra IAM
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8090/realms/sample/protocol/openid-connect/auth
          tokenUrl: http://localhost:8090/realms/sample/protocol/openid-connect/token
          scopes:
            openid: OpenID scope
            profile: User profile scope
            api: API access scope
